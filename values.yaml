# -----------------------------------------------------------------------------
# Relay (always on; ingest edge)
# -----------------------------------------------------------------------------
relay:
  enabled: true
  replicas: 1
  mode: managed
  image: {}
  env: []
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  nodeSelector: {}
  affinity: {}
  tolerations: []
  podAnnotations: {}
  service:
    annotations: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75

# -----------------------------------------------------------------------------
# Symbolicator (native stacktrace symbolication; opt-in)
# -----------------------------------------------------------------------------
symbolicator:
  enabled: false
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  nodeSelector: {}
  # The symbolicator image is distroless (gcr.io/distroless/cc:nonroot) and runs
  # as uid/gid 65532. Its cache_dir (/data) is a mounted volume, which lands
  # root-owned; fsGroup makes it writable by the nonroot group.
  podSecurityContext:
    fsGroup: 65532
  api:
    useDeployment: true
  persistence:
    enabled: true
    size: 10Gi
    accessMode: ReadWriteOnce
    storageClass: ""

# -----------------------------------------------------------------------------
# vroom (profiling) / uptimeChecker / launchpad (opt-in)
# -----------------------------------------------------------------------------
vroom:
  enabled: false
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  nodeSelector: {}
  persistence:
    enabled: true
    size: 10Gi
    accessMode: ReadWriteOnce
    storageClass: ""

uptimeChecker:
  enabled: false
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 300m
      memory: 1Gi
  nodeSelector: {}
  allowInternalIps: false
  failureRetries: 1

launchpad:
  enabled: false
  replicas: 1
  concurrency: 4
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  nodeSelector: {}

# -----------------------------------------------------------------------------
# ClickHouse (bundled, first-class - no operator)
# -----------------------------------------------------------------------------
clickhouse:
  enabled: true
  image:
    repository: altinity/clickhouse-server
    tag: 25.3.6.10034.altinitystable
    pullPolicy: IfNotPresent
  # Default-user password; "" => no password (matches docker-compose).
  password: ""
  existingSecret: ""
  existingSecretKey: clickhouse-password
  # Single-node by default. Set shards/replicas > 1 to auto-enable Keeper + cluster.
  layout:
    shardsCount: 1
    replicasCount: 1
  clusterName: sentry
  distributedClusterName: ""
  keeper:
    # Auto-enabled when shardsCount>1 or replicasCount>1; force on/off here.
    enabled: false
    replicaCount: 3
    image:
      repository: altinity/clickhouse-keeper
      tag: 25.3.6.10034.altinitystable
      pullPolicy: IfNotPresent
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    nodeSelector: {}
  # settings -> config.xml (server level), profiles -> users.xml.
  settings:
    max_server_memory_usage_to_ram_ratio: "0.3"
  profiles: {}
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  nodeSelector: {}
  affinity: {}
  tolerations: []
  podAnnotations: {}
  podLabels: {}
  # PodDisruptionBudget (only created when clustered: shards*replicas > 1).
  pdb:
    enabled: true
    maxUnavailable: 1
    minAvailable: ""
  service:
    annotations: {}

externalClickhouse:
  # Used only when clickhouse.enabled=false.
  host: ""
  tcpPort: 9000
  httpPort: 8123
  username: default
  password: ""
  database: default
  singleNode: true
  clusterName: ""
  existingSecret: ""
  existingSecretKey: clickhouse-password

# -----------------------------------------------------------------------------
# Datastores (first-class in-tree templates) + external alternatives
#
# Postgres, Redis, Kafka and Memcached are rendered directly by this chart
# (templates/{postgresql,redis,kafka,memcached}) using the same images Sentry
# self-hosted ships. No Bitnami / external subcharts are involved. Each defaults
# to single-node; HA toggles are documented per block. To use a managed/external
# datastore instead, set `enabled: false` and fill the matching `external*` block.
# -----------------------------------------------------------------------------
kafka:
  enabled: true
  image:
    repository: confluentinc/cp-kafka
    tag: 7.6.6
    pullPolicy: IfNotPresent
  # Single-node KRaft by default. For HA set replicas to an odd number (e.g. 3)
  # AND replicationFactor/minInsyncReplicas so auto-created topics are durable.
  # NOTE: changing replicas after first boot requires manual KRaft quorum steps.
  replicas: 1
  replicationFactor: 1
  minInsyncReplicas: 1
  # KRaft cluster id (must be stable for the life of the cluster).
  clusterId: "MkU3OEVBNTcwNTJENDM2Qk"
  # 50 MB message ceiling (matches docker-compose; large events/sourcemaps).
  maxMessageBytes: 50000000
  logRetentionHours: 24
  logLevel: WARN
  heapOpts: ""
  # Extra raw KAFKA_* env (e.g. {KAFKA_NUM_PARTITIONS: "3"}).
  extraEnv: {}
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  nodeSelector: {}
  affinity: {}
  tolerations: []
  podAnnotations: {}
  podLabels: {}
  # PodDisruptionBudget (only created when replicas > 1).
  pdb:
    enabled: true
    maxUnavailable: 1
    minAvailable: ""

externalKafka:
  # When kafka.enabled=false, list brokers: [{ host: kafka, port: 9092 }]
  brokers: []

redis:
  enabled: true
  image:
    repository: redis
    # MUST stay 6.2.x: Sentry tracks Redis 6.2 (Redis 7 / Valkey have known
    # incompatibilities). Overridable, but change at your own risk.
    tag: 6.2.20-alpine
    pullPolicy: IfNotPresent
  # standalone (single node) | replication (pod-0 master + read replicas).
  architecture: standalone
  # Used when architecture=replication or sentinel.enabled.
  replicas: 3
  auth:
    enabled: false
    password: ""
    existingSecret: ""
    existingSecretKey: redis-password
  # HA via Redis Sentinel. Adds a sentinel sidecar per pod plus an HAProxy
  # master-router so the single `-redis-master` endpoint always follows failover
  # (Snuba's client is not Sentinel-aware, so a stable master VIP is required).
  sentinel:
    enabled: false
    masterName: mymaster
    quorum: 2
    downAfterMilliseconds: 5000
    failoverTimeout: 60000
  haproxy:
    replicas: 1
    image:
      repository: haproxy
      tag: 2.9-alpine
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 32Mi
  # Extra redis.conf lines appended verbatim.
  config: ""
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  affinity: {}
  tolerations: []
  podAnnotations: {}
  podLabels: {}
  # PodDisruptionBudget (only created in HA mode: replication/sentinel, replicas > 1).
  pdb:
    enabled: true
    maxUnavailable: 1
    minAvailable: ""

externalRedis:
  host: ""
  port: 6379
  password: ""
  db: 0
  ssl: false
  existingSecret: ""

postgresql:
  enabled: true
  image:
    # Sentry requires Postgres >= 14; 16 chosen for a greenfield install.
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  auth:
    database: sentry
    username: postgres
    # Leave empty to auto-generate (preserved across upgrades). Or set
    # existingSecret (+ existingSecretKey) to supply your own.
    password: ""
    existingSecret: ""
    existingSecretKey: postgres-password
  # Passed as `postgres -c max_connections=...`; bump for many workers.
  maxConnections: 100
  # /dev/shm size (parallel query / sort scratch).
  shmSize: 256Mi
  # Extra `postgres -c key=value` flags, e.g. ["-c", "shared_buffers=512MB"].
  extraArgs: []
  # Single-node only. For HA, use a managed/operator Postgres via externalPostgresql.
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  nodeSelector: {}
  affinity: {}
  tolerations: []
  podAnnotations: {}
  podLabels: {}

externalPostgresql:
  host: ""
  port: 5432
  username: postgres
  password: ""
  database: sentry
  sslMode: prefer
  existingSecret: ""

memcached:
  enabled: true
  image:
    repository: memcached
    tag: 1.6.26-alpine
    pullPolicy: IfNotPresent
  # Pure cache (regenerable). >1 replica behind one VIP is NOT real sharding;
  # keep at 1 unless you add client-side multi-host config. Single-node by design.
  replicaCount: 1
  # Max memory for the cache, in MB.
  memoryLimitMb: 64
  # Max item size; matches docker-compose `-I 1M` (sourcemap upload ceiling).
  maxItemSize: "1m"
  extraArgs: []
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  nodeSelector: {}
  affinity: {}
  tolerations: []
  podAnnotations: {}
  podLabels: {}

# -----------------------------------------------------------------------------
# Storage backends (filestore / replay / nodestore / mail)
# -----------------------------------------------------------------------------
filestore:
  # filesystem | s3 | gcs
  backend: filesystem
  filesystem:
    path: /data/files
    persistence:
      enabled: true
      size: 20Gi
      accessMode: ReadWriteOnce
      persistentWorkers: true
      existingClaim: ""
      storageClass: ""
  s3:
    existingSecret: ""
    accessKey: ""
    secretKey: ""
    bucketName: ""
    endpointUrl: ""
    region_name: ""
    signature_version: s3v4
    default_acl: ""
    addressing_style: path
  gcs: {}
  # Profiles can use a separate backend (recommended: s3).
  profiles:
    backend: filesystem
    s3:
      existingSecret: ""
      accessKey: ""
      secretKey: ""
      bucketName: profiles
      endpointUrl: ""
      region_name: ""
    gcs: {}
    filesystem:
      path: /var/vroom/sentry-profiles

replay:
  storage:
    # "" => use the main filestore backend.
    backend: ""
    s3:
      existingSecret: ""
      bucketName: ""
      endpointUrl: ""
      region_name: ""
    gcs: {}

nodestore:
  # "" => default (uses filestore/db). "s3" installs sentry-nodestore-s3.
  backend: ""
  s3:
    existingSecret: ""
    accessKey: ""
    secretKey: ""
    bucketName: nodestore
    endpointUrl: ""
    region_name: ""

mail:
  enabled: false
  host: ""
  port: 587
  username: ""
  password: ""
  existingSecret: ""
  useTls: true
  useSsl: false
  from: ""

# -----------------------------------------------------------------------------
# Routing (bundled nginx proxy) + optional Ingress
# -----------------------------------------------------------------------------
nginx:
  # Bundled routing proxy that does the relay/web regex split (single ClusterIP).
  enabled: true
  image:
    repository: nginx
    tag: 1.31.0-alpine
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  nodeSelector: {}
  affinity: {}
  tolerations: []
  podAnnotations: {}
  clientMaxBodySize: 100m
  service:
    type: ClusterIP
    port: 80
    annotations: {}

ingress:
  # Optional networking.k8s.io/v1 Ingress that forwards / to the nginx proxy.
  enabled: false
  className: ""
  annotations: {}
  hostname: ""
  path: /
  pathType: Prefix
  tls: []
