## sentry-k8s values
##
## every component is gated by its own `enabled` flag.
## The defaults below are the lightweight errors-only set; the examples/ files
## are presets (errors-only / errors+transactions / feature-complete) that flip
## those flags. See README "Presets".
##
## This chart uses NO Helm lifecycle hooks; initialization is a plain Job.
## That makes it safe to deploy with Pulumi (k8s.helm.v3.Chart) and Terraform.

# -----------------------------------------------------------------------------
# Global / chart-wide
# -----------------------------------------------------------------------------
global:
  # Default storageClass for all bundled stateful workloads (ClickHouse,
  # Postgres, Redis, Kafka). Override per-component via <component>.persistence.storageClass.
  storageClass: ""
  # Default nodeSelector applied to chart-owned workloads (override per-component).
  nodeSelector: {}

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

serviceAccount:
  # Create+own the ServiceAccount that all pods use. Set create:false only if you
  # pre-provision your own SA (then set `name` to it); otherwise pods fail to
  # schedule with "serviceaccount not found".
  create: true
  # Empty => defaults to the release fullname. Set to reuse an existing SA.
  name: ""
  annotations: {}
  automountServiceAccountToken: true

revisionHistoryLimit: 10

# Raw extra manifests rendered as-is (list of objects or multi-doc strings).
extraManifests: []

# All getsentry images share Chart.AppVersion when tag is "".
images:
  sentry:
    repository: ghcr.io/getsentry/sentry
    tag: ""
    pullPolicy: IfNotPresent
  snuba:
    repository: ghcr.io/getsentry/snuba
    tag: ""
    pullPolicy: IfNotPresent
  relay:
    repository: ghcr.io/getsentry/relay
    tag: ""
    pullPolicy: IfNotPresent
  symbolicator:
    repository: ghcr.io/getsentry/symbolicator
    tag: ""
    pullPolicy: IfNotPresent
  vroom:
    repository: ghcr.io/getsentry/vroom
    tag: ""
    pullPolicy: IfNotPresent
  taskbroker:
    repository: ghcr.io/getsentry/taskbroker
    tag: ""
    pullPolicy: IfNotPresent
  uptimeChecker:
    repository: ghcr.io/getsentry/uptime-checker
    tag: ""
    pullPolicy: IfNotPresent
  launchpad:
    repository: ghcr.io/getsentry/launchpad
    tag: ""
    pullPolicy: IfNotPresent
  # Helper images used by init containers / waits / cleanup.
  busybox:
    repository: busybox
    tag: "1.36"
    pullPolicy: IfNotPresent

# -----------------------------------------------------------------------------
# Initial superuser + bootstrap (replaces Helm hooks)
# -----------------------------------------------------------------------------
user:
  create: true
  email: admin@example.com
  # Provide via existingSecret (key: admin-password) in real deployments.
  password: ""
  existingSecret: ""

bootstrap:
  # Run the init Job: snuba bootstrap -> sentry upgrade -> create user -> sentinel.
  enabled: true
  ttlSecondsAfterFinished: 1800
  # Init container nc-waits for ClickHouse/Kafka/Postgres/Redis before migrating.
  waitForInfra: true
  # Applies to the final no-op "done" container only; the heavy init containers
  # (snuba-bootstrap, snuba-migrate, sentry-upgrade, create-user) run unconstrained.
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  podAnnotations: {}
  # App pods poll this sentinel (a ConfigMap) to know the bootstrap finished.
  sentinel:
    enabled: true

# -----------------------------------------------------------------------------
# Sentry (core + workers)
# -----------------------------------------------------------------------------
sentry:
  # Each component is gated by its own
  # `enabled` flag below; the files in examples/ are ready-made presets
  # (errors-only / errors+transactions / feature-complete) that toggle them.
  #
  # Sets Sentry's SENTRY_SELF_HOSTED_ERRORS_ONLY. true hides the performance/
  # transactions/replays/etc. product surfaces (pairs with the lightweight,
  # errors-only component set). Set false once you enable those pipelines.
  selfHostedErrorsOnly: true
  eventRetentionDays: 90

  system:
    # Public URL users hit (TLS terminates upstream at your proxy).
    # Drives system.url-prefix + CSRF_TRUSTED_ORIGINS; X-Forwarded-Proto trusted.
    url: ""
    adminEmail: ""

  # Extra SENTRY_FEATURES flags: { "organizations:feature": true }
  features: {}
  # Extra raw python appended to sentry.conf.py
  config: ""
  # Extra config.yml keys (map merged into config.yml)
  configYml: {}

  # Extra pip packages installed into PYTHONUSERBASE (/data/custom-packages) via
  # an init container on every Sentry-image pod, instead of baking a custom
  # image. Useful for auth plugins, e.g. SSO with an OIDC provider:
  #   extraPipPackages: ["sentry-auth-oidc==9.1.1"]
  # then wire the OIDC_* settings via sentry.config (see README "SSO").
  extraPipPackages: []

  web:
    enabled: true
    replicas: 1
    workers: 3
    image: {}
    env: []
    resources:
      requests:
        cpu: 200m
        memory: 850Mi
      limits:
        cpu: 500m
        memory: 1Gi
    nodeSelector: {}
    affinity: {}
    tolerations: []
    podAnnotations: {}
    podLabels: {}
    securityContext: {}
    containerSecurityContext: {}
    priorityClassName: ""
    service:
      annotations: {}
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilizationPercentage: 75

  taskbroker:
    enabled: true
    replicas: 1
    image: {}
    env: []
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    nodeSelector: {}
    affinity: {}
    tolerations: []
    podAnnotations: {}
    persistence:
      enabled: true
      size: 10Gi
      accessMode: ReadWriteOnce
      storageClass: ""

  taskscheduler:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi
    nodeSelector: {}

  taskworker:
    enabled: true
    replicas: 1
    concurrency: 4
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    nodeSelector: {}

  # --- base error-tracking ingest/consumers (on by default) ---
  ingestEvents:
    enabled: true
    resources: {}
    podLabels: {}
  ingestAttachments:
    enabled: true
    resources: {}
    podLabels: {}
  postProcessForwarderErrors:
    enabled: true
    resources: {}
    podLabels: {}
  subscriptionConsumerEvents:
    enabled: true
    resources: {}
    podLabels: {}

  cleanup:
    enabled: true
    schedule: "0 0 * * *"
    resources:
      requests:
        cpu: 300m
        memory: 1Gi
      limits:
        cpu: 500m
        memory: 2Gi
    nodeSelector: {}

  # --- transactions / metrics / replays / profiling / monitors / uptime / spans
  # consumers (off by default; flip enabled:true, see examples/). ---
  transactions:
    enabled: false
    resources: {}
    podLabels: {}
  metrics:
    enabled: false
    resources: {}
    podLabels: {}
  genericMetrics:
    enabled: false
    resources: {}
    podLabels: {}
  billingMetrics:
    enabled: false
    resources: {}
    podLabels: {}
  ingestReplayRecordings:
    enabled: false
    resources: {}
    podLabels: {}
  ingestOccurrences:
    enabled: false
    resources: {}
    podLabels: {}
  ingestProfiles:
    enabled: false
    resources: {}
    podLabels: {}
  ingestMonitors:
    enabled: false
    resources: {}
    podLabels: {}
  ingestFeedback:
    enabled: false
    resources: {}
    podLabels: {}
  processSpans:
    enabled: false
    resources: {}
    podLabels: {}
  processSegments:
    enabled: false
    resources: {}
    podLabels: {}
  monitorsClockTick:
    enabled: false
    resources: {}
    podLabels: {}
  monitorsClockTasks:
    enabled: false
    resources: {}
    podLabels: {}
  uptimeResults:
    enabled: false
    resources: {}
    podLabels: {}
  postProcessForwarderTransactions:
    enabled: false
    resources: {}
    podLabels: {}
  postProcessForwarderIssuePlatform:
    enabled: false
    resources: {}
    podLabels: {}
  subscriptionConsumerTransactions:
    enabled: false
    resources: {}
    podLabels: {}
  subscriptionConsumerMetrics:
    enabled: false
    resources: {}
    podLabels: {}
  subscriptionConsumerGenericMetrics:
    enabled: false
    resources: {}
    podLabels: {}
  subscriptionConsumerEapItems:
    enabled: false
    resources: {}
    podLabels: {}

