## sentry-k8s values
##
## every component is gated by its own `enabled` flag.
## The defaults below are the lightweight errors-only set; the examples/ files
## are presets (errors-only / errors+transactions / feature-complete) that flip
## those flags. See README "Presets".
##
## This chart uses NO Helm lifecycle hooks; initialization is a plain Job.
## That makes it safe to deploy with Pulumi (k8s.helm.v3.Chart) and Terraform.

# -----------------------------------------------------------------------------
# Global / chart-wide
# -----------------------------------------------------------------------------
global:
  # Default storageClass for all bundled stateful workloads (ClickHouse,
  # Postgres, Redis, Kafka). Override per-component via <component>.persistence.storageClass.
  storageClass: ""
  # Default nodeSelector applied to chart-owned workloads (override per-component).
  nodeSelector: {}
  # Kafka max poll interval in ms — applied to all Sentry/Snuba consumers
  # when appVersion >= 26.6.0. Raise this if you see consumer rebalances
  # during long batch processing.
  kafkaMaxPollIntervalMs: "300000"

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

serviceAccount:
  # Create+own the ServiceAccount that all pods use. Set create:false only if you
  # pre-provision your own SA (then set `name` to it); otherwise pods fail to
  # schedule with "serviceaccount not found".
  create: true
  # Empty => defaults to the release fullname. Set to reuse an existing SA.
  name: ""
  annotations: {}
  automountServiceAccountToken: true

revisionHistoryLimit: 10

# Raw extra manifests rendered as-is (list of objects or multi-doc strings).
extraManifests: []

# All getsentry images share Chart.AppVersion when tag is "".
images:
  sentry:
    repository: ghcr.io/getsentry/sentry
    tag: ""
    pullPolicy: IfNotPresent
  snuba:
    repository: ghcr.io/getsentry/snuba
    tag: ""
    pullPolicy: IfNotPresent
  relay:
    repository: ghcr.io/getsentry/relay
    tag: ""
    pullPolicy: IfNotPresent
  symbolicator:
    repository: ghcr.io/getsentry/symbolicator
    tag: ""
    pullPolicy: IfNotPresent
  vroom:
    repository: ghcr.io/getsentry/vroom
    tag: ""
    pullPolicy: IfNotPresent
  taskbroker:
    repository: ghcr.io/getsentry/taskbroker
    tag: ""
    pullPolicy: IfNotPresent
  uptimeChecker:
    repository: ghcr.io/getsentry/uptime-checker
    tag: ""
    pullPolicy: IfNotPresent
  launchpad:
    repository: ghcr.io/getsentry/launchpad
    tag: ""
    pullPolicy: IfNotPresent
  # Helper images used by init containers / waits / cleanup.
  busybox:
    repository: busybox
    # Relay copies this binary into its distroless image, so it must be static.
    tag: "1.36.1-musl"
    pullPolicy: IfNotPresent

# -----------------------------------------------------------------------------
# Initial superuser + bootstrap (replaces Helm hooks)
# -----------------------------------------------------------------------------
user:
  create: true
  email: admin@example.com
  # Provide via existingSecret (key: admin-password) in real deployments.
  password: ""
  existingSecret: ""

bootstrap:
  # Run the init Job: snuba bootstrap -> sentry upgrade -> create user -> sentinel.
  enabled: true
  ttlSecondsAfterFinished: 1800
  # Init container nc-waits for ClickHouse/Kafka/Postgres/Redis before migrating.
  waitForInfra: true
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  podAnnotations: {}
  # App pods poll this sentinel (a ConfigMap) to know the bootstrap finished.
  sentinel:
    enabled: true

# -----------------------------------------------------------------------------
# Sentry (core + workers)
# -----------------------------------------------------------------------------
sentry:
  # Each component is gated by its own
  # `enabled` flag below; the files in examples/ are ready-made presets
  # (errors-only / errors+transactions / feature-complete) that toggle them.
  #
  # Sets Sentry's SENTRY_SELF_HOSTED_ERRORS_ONLY. true hides the performance/
  # transactions/replays/etc. product surfaces (pairs with the lightweight,
  # errors-only component set). Set false once you enable those pipelines.
  selfHostedErrorsOnly: true
  eventRetentionDays: 90

  system:
    # Public URL users hit (TLS terminates upstream at your proxy).
    # Drives system.url-prefix + CSRF_TRUSTED_ORIGINS; X-Forwarded-Proto trusted.
    url: ""
    adminEmail: ""

  # Extra SENTRY_FEATURES flags: { "organizations:feature": true }
  features: {}
  # Extra raw python appended to sentry.conf.py
  config: ""
  # Extra config.yml keys (map merged into config.yml)
  configYml: {}

  # JS SDK Loader — serves the browser SDK bundle locally for plain <script> projects
  jsSdk:
    # When true, Sentry downloads and serves JS SDK bundles from self-hosted
    # (Sentry returns a no-op CDN redirect loader when false).
    setupAssets: false
    # URL template used when setupAssets is true; %s = SDK version / bundle variant.
    # When empty (default), the template constructs an absolute URL from
    # sentry.system.url (e.g. https://sentry.example.com/js-sdk/%s/bundle%s.min.js).
    # Set this explicitly to override, e.g. to a CDN URL.
    defaultSdkUrl: ""

  # Extra pip packages installed into PYTHONUSERBASE (/data/custom-packages) via
  # an init container on every Sentry-image pod, instead of baking a custom
  # image. Useful for auth plugins, e.g. SSO with an OIDC provider:
  #   extraPipPackages: ["sentry-auth-oidc==9.1.1"]
  # then wire the OIDC_* settings via sentry.config (see README "SSO").
  extraPipPackages: []

  web:
    enabled: true
    replicas: 1
    workers: 3
    image: {}
    env: []
    resources: {}
    nodeSelector: {}
    affinity: {}
    tolerations: []
    podAnnotations: {}
    podLabels: {}
    securityContext: {}
    containerSecurityContext: {}
    priorityClassName: ""
    service:
      annotations: {}
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilizationPercentage: 75

  taskbroker:
    enabled: true
    replicas: 1
    image: {}
    env: []
    resources: {}
    nodeSelector: {}
    affinity: {}
    tolerations: []
    podAnnotations: {}
    persistence:
      enabled: true
      size: 10Gi
      accessMode: ReadWriteOnce
      storageClass: ""

  taskscheduler:
    enabled: true
    replicas: 1
    resources: {}
    nodeSelector: {}

  taskworker:
    enabled: true
    replicas: 1
    concurrency: 4
    resources: {}
    nodeSelector: {}

  # --- base error-tracking ingest/consumers (on by default) ---
  ingestEvents: { enabled: true }
  ingestAttachments: { enabled: true }
  postProcessForwarderErrors: { enabled: true }
  subscriptionConsumerEvents: { enabled: true }

  cleanup:
    enabled: true
    schedule: "0 0 * * *"
    resources: {}
    nodeSelector: {}

  # --- transactions / metrics / replays / profiling / monitors / uptime / spans
  # consumers (off by default; flip enabled:true, see examples/). ---
  transactions: { enabled: false }
  metrics: { enabled: false }
  genericMetrics: { enabled: false }
  billingMetrics: { enabled: false }
  ingestReplayRecordings: { enabled: false }
  ingestOccurrences: { enabled: false }
  ingestProfiles: { enabled: false }
  ingestMonitors: { enabled: false }
  ingestFeedback: { enabled: false }
  processSpans: { enabled: false }
  processSegments: { enabled: false }
  monitorsClockTick: { enabled: false }
  monitorsClockTasks: { enabled: false }
  uptimeResults: { enabled: false }
  postProcessForwarderTransactions: { enabled: false }
  postProcessForwarderIssuePlatform: { enabled: false }
  subscriptionConsumerTransactions: { enabled: false }
  subscriptionConsumerMetrics: { enabled: false }
  subscriptionConsumerGenericMetrics: { enabled: false }
  subscriptionConsumerEapItems: { enabled: false }

# -----------------------------------------------------------------------------
# Snuba
# -----------------------------------------------------------------------------
snuba:
  rustConsumer: true
  clickhouse:
    maxConnections: 100
  cleanup:
    # NOT production-ready; off by default.
    enabled: false
    schedule: "0 * * * *"

  api:
    enabled: true
    replicas: 1
    resources: {}
    nodeSelector: {}
    affinity: {}
    tolerations: []
    podAnnotations: {}
    service:
      annotations: {}
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilizationPercentage: 75

  # --- base error-tracking (on by default) ---
  consumer: { enabled: true }
  outcomesConsumer: { enabled: true }
  outcomesBillingConsumer: { enabled: true }
  replacer: { enabled: true }
  groupAttributesConsumer: { enabled: true }
  subscriptionConsumerEvents: { enabled: true }

  # --- transactions / replays / metrics / profiling / EAP (off by default) ---
  transactionsConsumer: { enabled: false }
  replaysConsumer: { enabled: false }
  issueOccurrenceConsumer: { enabled: false }
  metricsConsumer: { enabled: false }
  genericMetricsSetsConsumer: { enabled: false }
  genericMetricsCountersConsumer: { enabled: false }
  genericMetricsDistributionsConsumer: { enabled: false }
  genericMetricsGaugesConsumer: { enabled: false }
  profilingProfilesConsumer: { enabled: false }
  profilingFunctionsConsumer: { enabled: false }
  profilingChunksConsumer: { enabled: false }
  eapItemsConsumer: { enabled: false }
  subscriptionConsumerTransactions: { enabled: false }
  subscriptionConsumerMetrics: { enabled: false }
  subscriptionConsumerGenericMetricsSets: { enabled: false }
  subscriptionConsumerGenericMetricsCounters: { enabled: false }
  subscriptionConsumerGenericMetricsDistributions: { enabled: false }
  subscriptionConsumerGenericMetricsGauges: { enabled: false }
  subscriptionConsumerEapItems: { enabled: false }

# -----------------------------------------------------------------------------
# Relay (always on; ingest edge)
# -----------------------------------------------------------------------------
relay:
  enabled: true
  replicas: 1
  mode: managed
  image: {}
  env: []
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  podAnnotations: {}
  kafka:
    # Relay and the bootstrap Job start independently. Keep validation off unless
    # topics are provisioned before Relay starts (the Job creates them later).
    validateTopics: false
    # librdkafka producer recovery controls. Rebootstrap prevents a producer from
    # remaining attached to stale broker metadata after a complete outage.
    metadataRecoveryStrategy: rebootstrap
    metadataRecoveryRebootstrapTriggerMs: 30000
    topicMetadataRefreshIntervalMs: 30000
    metadataMaxAgeMs: 90000
    healthProbes:
      # auto: couple Relay health to Kafka only for bundled single-broker Kafka.
      # enabled: opt in explicitly for another topology; disabled: Relay-only health.
      mode: auto
      readiness:
        initialDelaySeconds: 15
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 1
        successThreshold: 1
      # A Kafka readiness failure is remembered until Relay restarts. Twenty
      # consecutive liveness failures restart it once after about five minutes,
      # refreshing a producer that did not recover when Kafka came back.
      liveness:
        initialDelaySeconds: 30
        periodSeconds: 15
        timeoutSeconds: 3
        failureThreshold: 20
        successThreshold: 1
  service:
    annotations: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75

# -----------------------------------------------------------------------------
# Symbolicator (native stacktrace symbolication; opt-in)
# -----------------------------------------------------------------------------
symbolicator:
  enabled: false
  replicas: 1
  resources: {}
  nodeSelector: {}
  # The symbolicator image is distroless (gcr.io/distroless/cc:nonroot) and runs
  # as uid/gid 65532. Its cache_dir (/data) is a mounted volume, which lands
  # root-owned; fsGroup makes it writable by the nonroot group.
  podSecurityContext:
    fsGroup: 65532
  api:
    useDeployment: true
  persistence:
    enabled: true
    size: 10Gi
    accessMode: ReadWriteOnce
    storageClass: ""

# -----------------------------------------------------------------------------
# vroom (profiling) / uptimeChecker / launchpad (opt-in)
# -----------------------------------------------------------------------------
vroom:
  enabled: false
  replicas: 1
  resources: {}
  nodeSelector: {}
  persistence:
    enabled: true
    size: 10Gi
    accessMode: ReadWriteOnce
    storageClass: ""

uptimeChecker:
  enabled: false
  replicas: 1
  resources: {}
  nodeSelector: {}
  allowInternalIps: false
  failureRetries: 1

launchpad:
  enabled: false
  replicas: 1
  concurrency: 4
  resources: {}
  nodeSelector: {}

# -----------------------------------------------------------------------------
# ClickHouse (bundled, first-class - no operator)
# -----------------------------------------------------------------------------
clickhouse:
  enabled: true
  image:
    repository: altinity/clickhouse-server
    tag: 25.3.6.10034.altinitystable
    pullPolicy: IfNotPresent
  # Default-user password; "" => no password (matches docker-compose).
  password: ""
  existingSecret: ""
  existingSecretKey: clickhouse-password
  # Single-node by default. Set shards/replicas > 1 to auto-enable Keeper + cluster.
  layout:
    shardsCount: 1
    replicasCount: 1
  clusterName: sentry
  distributedClusterName: ""
  keeper:
    # Auto-enabled when shardsCount>1 or replicasCount>1; force on/off here.
    enabled: false
    replicaCount: 3
    image:
      repository: altinity/clickhouse-keeper
      tag: 25.3.6.10034.altinitystable
      pullPolicy: IfNotPresent
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""
    resources: {}
    nodeSelector: {}
  # settings -> config.xml (server level), profiles -> users.xml.
  settings:
    max_server_memory_usage_to_ram_ratio: "0.3"
  profiles: {}
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  podAnnotations: {}
  podLabels: {}
  # PodDisruptionBudget (only created when clustered: shards*replicas > 1).
  pdb:
    enabled: true
    maxUnavailable: 1
    minAvailable: ""
  service:
    annotations: {}

externalClickhouse:
  # Used only when clickhouse.enabled=false.
  host: ""
  tcpPort: 9000
  httpPort: 8123
  username: default
  password: ""
  database: default
  singleNode: true
  clusterName: ""
  existingSecret: ""
  existingSecretKey: clickhouse-password

# -----------------------------------------------------------------------------
# Datastores (first-class in-tree templates) + external alternatives
#
# Postgres, Redis, Kafka and Memcached are rendered directly by this chart
# (templates/{postgresql,redis,kafka,memcached}) using the same images Sentry
# self-hosted ships. No Bitnami / external subcharts are involved. Each defaults
# to single-node; HA toggles are documented per block. To use a managed/external
# datastore instead, set `enabled: false` and fill the matching `external*` block.
# -----------------------------------------------------------------------------
kafka:
  enabled: true
  image:
    repository: confluentinc/cp-kafka
    tag: 7.6.6
    pullPolicy: IfNotPresent
  # Single-node KRaft by default. For HA set replicas to an odd number (e.g. 3)
  # AND replicationFactor/minInsyncReplicas so auto-created topics are durable.
  # NOTE: changing replicas after first boot requires manual KRaft quorum steps.
  replicas: 1
  replicationFactor: 1
  minInsyncReplicas: 1
  # KRaft cluster id (must be stable for the life of the cluster).
  clusterId: "MkU3OEVBNTcwNTJENDM2Qk"
  # 50 MB message ceiling (matches docker-compose; large events/sourcemaps).
  maxMessageBytes: 50000000
  logRetentionHours: 24
  logLevel: WARN
  heapOpts: ""
  semanticProbes:
    # auto: semantic probes for one bundled broker, TCP probes for HA. semantic
    # explicitly requires replicas=1; tcp restores the previous probes.
    mode: auto
    # kafka-topics starts a JVM for each exec probe; bound its transient heap.
    heapOpts: "-Xms32m -Xmx64m"
    startup:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 30
      successThreshold: 1
    readiness:
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 1
      successThreshold: 1
    # Sustained semantic failure is required before restarting the broker.
    liveness:
      initialDelaySeconds: 0
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 6
      successThreshold: 1
  # Extra raw KAFKA_* env (e.g. {KAFKA_NUM_PARTITIONS: "3"}).
  extraEnv: {}
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  podAnnotations: {}
  podLabels: {}
  # PodDisruptionBudget (only created when replicas > 1).
  pdb:
    enabled: true
    maxUnavailable: 1
    minAvailable: ""

externalKafka:
  # When kafka.enabled=false, list brokers: [{ host: kafka, port: 9092 }]
  brokers: []

redis:
  enabled: true
  image:
    repository: redis
    # MUST stay 6.2.x: Sentry tracks Redis 6.2 (Redis 7 / Valkey have known
    # incompatibilities). Overridable, but change at your own risk.
    tag: 6.2.20-alpine
    pullPolicy: IfNotPresent
  # standalone (single node) | replication (pod-0 master + read replicas).
  architecture: standalone
  # Used when architecture=replication or sentinel.enabled.
  replicas: 3
  auth:
    enabled: false
    password: ""
    existingSecret: ""
    existingSecretKey: redis-password
  # HA via Redis Sentinel. Adds a sentinel sidecar per pod plus an HAProxy
  # master-router so the single `-redis-master` endpoint always follows failover
  # (Snuba's client is not Sentinel-aware, so a stable master VIP is required).
  sentinel:
    enabled: false
    masterName: mymaster
    quorum: 2
    downAfterMilliseconds: 5000
    failoverTimeout: 60000
  haproxy:
    replicas: 1
    image:
      repository: haproxy
      tag: 2.9-alpine
      pullPolicy: IfNotPresent
    resources: {}
  # Extra redis.conf lines appended verbatim.
  config: ""
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  podAnnotations: {}
  podLabels: {}
  # PodDisruptionBudget (only created in HA mode: replication/sentinel, replicas > 1).
  pdb:
    enabled: true
    maxUnavailable: 1
    minAvailable: ""

externalRedis:
  host: ""
  port: 6379
  password: ""
  db: 0
  ssl: false
  existingSecret: ""

postgresql:
  enabled: true
  image:
    # Sentry requires Postgres >= 14; 16 chosen for a greenfield install.
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  auth:
    database: sentry
    username: postgres
    # Leave empty to auto-generate (preserved across upgrades). Or set
    # existingSecret (+ existingSecretKey) to supply your own.
    password: ""
    existingSecret: ""
    existingSecretKey: postgres-password
  # Passed as `postgres -c max_connections=...`; bump for many workers.
  maxConnections: 100
  # /dev/shm size (parallel query / sort scratch).
  shmSize: 256Mi
  # Extra `postgres -c key=value` flags, e.g. ["-c", "shared_buffers=512MB"].
  extraArgs: []
  # Single-node only. For HA, use a managed/operator Postgres via externalPostgresql.
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  podAnnotations: {}
  podLabels: {}

externalPostgresql:
  host: ""
  port: 5432
  username: postgres
  password: ""
  database: sentry
  sslMode: prefer
  existingSecret: ""

memcached:
  enabled: true
  image:
    repository: memcached
    tag: 1.6.26-alpine
    pullPolicy: IfNotPresent
  # Pure cache (regenerable). >1 replica behind one VIP is NOT real sharding;
  # keep at 1 unless you add client-side multi-host config. Single-node by design.
  replicaCount: 1
  # Max memory for the cache, in MB.
  memoryLimitMb: 64
  # Max item size; matches docker-compose `-I 1M` (sourcemap upload ceiling).
  maxItemSize: "1m"
  extraArgs: []
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  podAnnotations: {}
  podLabels: {}

# -----------------------------------------------------------------------------
# Storage backends (filestore / replay / nodestore / mail)
# -----------------------------------------------------------------------------
filestore:
  # filesystem | s3 | gcs
  backend: filesystem
  filesystem:
    path: /data/files
    persistence:
      enabled: true
      size: 20Gi
      accessMode: ReadWriteOnce
      persistentWorkers: true
      existingClaim: ""
      storageClass: ""
  s3:
    existingSecret: ""
    accessKey: ""
    secretKey: ""
    bucketName: ""
    endpointUrl: ""
    region_name: ""
    signature_version: s3v4
    default_acl: ""
    addressing_style: path
  gcs: {}
  # Profiles can use a separate backend (recommended: s3).
  profiles:
    backend: filesystem
    s3:
      existingSecret: ""
      accessKey: ""
      secretKey: ""
      bucketName: profiles
      endpointUrl: ""
      region_name: ""
    gcs: {}
    filesystem:
      path: /var/vroom/sentry-profiles

replay:
  storage:
    # "" => use the main filestore backend.
    backend: ""
    s3:
      existingSecret: ""
      bucketName: ""
      endpointUrl: ""
      region_name: ""
    gcs: {}

nodestore:
  # "" => default (uses filestore/db). "s3" installs sentry-nodestore-s3.
  backend: ""
  s3:
    existingSecret: ""
    accessKey: ""
    secretKey: ""
    bucketName: nodestore
    endpointUrl: ""
    region_name: ""

mail:
  enabled: false
  host: ""
  port: 587
  username: ""
  password: ""
  # Existing Kubernetes Secret containing SMTP credentials. When supplied, it
  # takes precedence over username/password and is injected into every Sentry
  # application workload rather than written into a ConfigMap.
  existingSecret: ""
  existingSecretUsernameKey: username
  existingSecretPasswordKey: password
  useTls: true
  useSsl: false
  from: ""

# -----------------------------------------------------------------------------
# Routing (bundled nginx proxy) + optional Ingress
# -----------------------------------------------------------------------------
nginx:
  # Bundled routing proxy that does the relay/web regex split (single ClusterIP).
  enabled: true
  image:
    repository: nginx
    tag: 1.31.0-alpine
    pullPolicy: IfNotPresent
  replicas: 1
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  podAnnotations: {}
  clientMaxBodySize: 100m
  proxyReadTimeout: 30s
  service:
    type: ClusterIP
    port: 80
    annotations: {}

ingress:
  # Optional networking.k8s.io/v1 Ingress that forwards / to the nginx proxy.
  enabled: false
  className: ""
  annotations: {}
  hostname: ""
  path: /
  pathType: Prefix
  tls: []
