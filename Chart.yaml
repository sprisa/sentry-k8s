apiVersion: v2
name: sentry-k8s
description: >-
  Self-contained Sentry self-hosted stack for Kubernetes with a first-class
  bundled ClickHouse (no Altinity operator, no external provisioning). Uses
  plain Kubernetes resources and NO Helm lifecycle hooks, making it
  Pulumi- and Terraform-friendly.
type: application
# Chart version is independent of the Sentry app version.
version: 1.4.1
# All getsentry images default to this tag for cross-service compatibility.
appVersion: "26.7.2"
keywords:
  - sentry
  - error-tracking
  - observability
  - clickhouse
  - snuba
  - self-hosted
home: https://github.com/sprisa/sentry-k8s
sources:
  - https://github.com/sprisa/sentry-k8s
maintainers:
  - name: Gabriel Meola
    email: banter@gabe.mx
    url: https://github.com/gabemeola
annotations:
  sentry-k8s/pulumi-friendly: "true"
  sentry-k8s/terraform-friendly: "true"
  sentry-k8s/uses-helm-hooks: "false"
  # Artifact Hub annotations
  artifacthub.io/category: monitoring-logging
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: support
      url: https://github.com/sprisa/sentry-k8s/issues
