# Taskfile for the sentry-k8s Helm chart.
# Install go-task: https://taskfile.dev/installation/  (brew install go-task)
# Run `task` (or `task --list`) to see available commands.
version: "3"

vars:
  CHART: sentry-k8s
  OWNER: sprisa
  REGISTRY: ghcr.io
  # OCI repo the chart is pushed to: oci://ghcr.io/sprisa
  OCI_REPO: oci://{{.REGISTRY}}/{{.OWNER}}
  NAMESPACE: sentry
  PKG_DIR: .cr-release-packages
  # Chart version is read straight from Chart.yaml so it stays the source of truth.
  CHART_VERSION:
    sh: awk '/^version:/ {print $2; exit}' Chart.yaml
  # Git tag / GitHub release name for this chart version.
  TAG: v{{.CHART_VERSION}}

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  lint:
    desc: Lint the chart
    cmds:
      - helm lint .

  template:
    desc: 'Render one example preset (EXAMPLE=errors-only|errors-transactions|feature-complete)'
    vars:
      EXAMPLE: '{{.EXAMPLE | default "errors-only"}}'
    cmds:
      - helm template {{.CHART}} . -n {{.NAMESPACE}} -f examples/values-{{.EXAMPLE}}.yaml

  test-render:
    desc: Render every example preset to confirm they all template cleanly
    cmds:
      - for: ["errors-only", "errors-transactions", "feature-complete"]
        cmd: helm template {{.CHART}} . -n {{.NAMESPACE}} -f examples/values-{{.ITEM}}.yaml > /dev/null && echo "OK  {{.ITEM}}"

  test-version-gates:
    desc: Verify version-gated config (taskbroker format, max-poll-interval-ms, replacer health check)
    cmds:
      - bash scripts/verify-version-gates.sh

  test:
    desc: Run all validation checks in parallel (lint, render, version gates)
    deps: [lint, test-render, test-version-gates]

  package:
    desc: Package the chart into a versioned .tgz
    cmds:
      - mkdir -p {{.PKG_DIR}}
      - helm package . --destination {{.PKG_DIR}}
      - 'echo "Packaged {{.PKG_DIR}}/{{.CHART}}-{{.CHART_VERSION}}.tgz"'

  login:
    desc: Log in to ghcr.io (needs $GHCR_TOKEN with write:packages; user = $GHCR_USER or your GH login)
    preconditions:
      - sh: '[ -n "$GHCR_TOKEN" ]'
        msg: "Set GHCR_TOKEN to a GitHub PAT with write:packages, e.g. export GHCR_TOKEN=ghp_..."
    cmds:
      - echo "$GHCR_TOKEN" | helm registry login {{.REGISTRY}} -u "${GHCR_USER:-{{.OWNER}}}" --password-stdin
      - echo "$GHCR_TOKEN" | cosign login {{.REGISTRY}} -u "${GHCR_USER:-{{.OWNER}}}" --password-stdin

  publish:
    desc: Push the chart to ghcr.io (OCI), sign it, and cut a GitHub Release (run `task login` first)
    deps: [package]
    preconditions:
      - sh: command -v gh >/dev/null
        msg: "GitHub CLI not found. Install it: https://cli.github.com (brew install gh)"
      - sh: command -v cosign >/dev/null
        msg: "cosign not found. Install it: brew install cosign"
      - sh: command -v oras >/dev/null
        msg: "oras not found. Install it: brew install oras"
      - sh: gh auth status >/dev/null 2>&1
        msg: "Not logged in to GitHub CLI. Run: gh auth login"
    cmds:
      - helm push {{.PKG_DIR}}/{{.CHART}}-{{.CHART_VERSION}}.tgz {{.OCI_REPO}}
      - 'echo "Published {{.OCI_REPO}}/{{.CHART}}:{{.CHART_VERSION}}"'
      # Sign the chart artifact with cosign (OIDC-based identity)
      - cosign sign --yes ghcr.io/sprisa/sentry-k8s:{{.CHART_VERSION}}
      - 'echo "Signed {{.OCI_REPO}}/{{.CHART}}:{{.CHART_VERSION}}"'
      # Push artifacthub-repo.yml to OCI registry for verified publisher badge.
      - 'oras push ghcr.io/sprisa/sentry-k8s:artifacthub.io --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml'
      # Build git-cliff-style notes from Conventional Commits since the last tag,
      # then cut the GitHub Release.
      - ./scripts/release-notes.sh {{.TAG}} {{.OWNER}}/{{.CHART}} > {{.PKG_DIR}}/RELEASE_NOTES.md
      - >-
        gh release create {{.TAG}}
        {{.PKG_DIR}}/{{.CHART}}-{{.CHART_VERSION}}.tgz
        --repo {{.OWNER}}/{{.CHART}}
        --title "{{.CHART_VERSION}}"
        --notes-file {{.PKG_DIR}}/RELEASE_NOTES.md
      - 'echo "Released {{.TAG}}: https://github.com/{{.OWNER}}/{{.CHART}}/releases/tag/{{.TAG}}"'
      - 'echo "NOTE: first publish creates a PRIVATE GHCR package. Make it public at:"'
      - 'echo "  https://github.com/users/{{.OWNER}}/packages/container/{{.CHART}}/settings"'

  notes:
    desc: Preview the release notes that `task publish` would generate for this version
    cmds:
      - ./scripts/release-notes.sh {{.TAG}} {{.OWNER}}/{{.CHART}}

  pull-check:
    desc: Sanity-check that the published chart is publicly pullable
    cmds:
      - helm show chart {{.OCI_REPO}}/{{.CHART}} --version {{.CHART_VERSION}}

  clean:
    desc: Remove packaged artifacts
    cmds:
      - rm -rf {{.PKG_DIR}}
