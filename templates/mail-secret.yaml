{{- /*
Inline SMTP values are rendered into a dedicated Secret rather than the
chart-wide generated Secret. This makes mail credential rollout independent of
other generated credentials and lets existingSecret remain a clean alternative.
*/ -}}
{{- if and .Values.mail.enabled (not .Values.mail.existingSecret) .Values.mail.username .Values.mail.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sentry.mail.secretName" . }}
  labels:
    {{- include "sentry.labels" . | nindent 4 }}
    app.kubernetes.io/component: mail
type: Opaque
data:
  username: {{ .Values.mail.username | b64enc | quote }}
  password: {{ .Values.mail.password | b64enc | quote }}
{{- end }}
