{{- $fullname := include "sentry.fullname" . }}
{{- /*
  Helm test pods. These use the `helm.sh/hook: test` annotation, which is a
  CLI-only construct run by `helm test`. It is NEVER applied during install/
  upgrade, and Pulumi's k8s.helm.v3.Chart drops it entirely. So the chart stays
  hook-free for normal deploys while still shipping `helm test` checks.
*/}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ $fullname }}-test-web
  labels:
    {{- include "sentry.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: test-web
      image: "{{ include "sentry.image" (dict "root" . "key" "busybox") }}"
      command:
        - /bin/sh
        - -c
        - |
          wget -q -O- "http://{{ $fullname }}-web:9000/_health/" && echo "web OK"
{{- if (ne .Values.snuba.api.enabled false) }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ $fullname }}-test-snuba
  labels:
    {{- include "sentry.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: test-snuba
      image: "{{ include "sentry.image" (dict "root" . "key" "busybox") }}"
      command:
        - /bin/sh
        - -c
        - |
          wget -q -O- "http://{{ $fullname }}-snuba:1218/health" && echo "snuba OK"
{{- end }}
{{- if .Values.clickhouse.enabled }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ $fullname }}-test-clickhouse
  labels:
    {{- include "sentry.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: test-clickhouse
      image: "{{ include "sentry.image" (dict "root" . "key" "busybox") }}"
      command:
        - /bin/sh
        - -c
        - |
          wget -q -O- "http://{{ include "sentry.clickhouse.host" . }}:{{ include "sentry.clickhouse.httpPort" . }}/ping" && echo "clickhouse OK"
{{- end }}
