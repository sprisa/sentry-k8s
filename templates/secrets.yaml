{{- $secretName := include "sentry.secretName" . }}
{{- /* Preserve generated secrets across helm upgrade / pulumi up via lookup. */}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) }}
{{- $secretKey := randAlphaNum 50 }}
{{- $systemSecretKey := randAlphaNum 50 }}
{{- $launchpadSecret := randAlphaNum 50 }}
{{- if $existing }}
{{- if (index $existing.data "secret-key") }}{{ $secretKey = index $existing.data "secret-key" | b64dec }}{{ end }}
{{- if (index $existing.data "system-secret-key") }}{{ $systemSecretKey = index $existing.data "system-secret-key" | b64dec }}{{ end }}
{{- if (index $existing.data "launchpad-rpc-shared-secret") }}{{ $launchpadSecret = index $existing.data "launchpad-rpc-shared-secret" | b64dec }}{{ end }}
{{- end }}
{{- $clickhousePassword := .Values.clickhouse.password | default "" }}
{{- /* Bundled Postgres password: explicit value, else preserved, else generated. */}}
{{- $postgresPassword := .Values.postgresql.auth.password | default "" }}
{{- if and .Values.postgresql.enabled (not $postgresPassword) (not .Values.postgresql.auth.existingSecret) }}
{{- if and $existing (index $existing.data "postgres-password") }}
{{- $postgresPassword = index $existing.data "postgres-password" | b64dec }}
{{- else }}
{{- $postgresPassword = randAlphaNum 24 }}
{{- end }}
{{- end }}
{{- /* Bundled Redis password (only when redis.auth.enabled). */}}
{{- $redisPassword := .Values.redis.auth.password | default "" }}
{{- if and .Values.redis.enabled .Values.redis.auth.enabled (not $redisPassword) (not .Values.redis.auth.existingSecret) }}
{{- if and $existing (index $existing.data "redis-password") }}
{{- $redisPassword = index $existing.data "redis-password" | b64dec }}
{{- else }}
{{- $redisPassword = randAlphaNum 24 }}
{{- end }}
{{- end }}
{{- $adminPassword := .Values.user.password | default "" }}
{{- if and (not $adminPassword) (not .Values.user.existingSecret) }}
{{- if and $existing (index $existing.data "admin-password") }}
{{- $adminPassword = index $existing.data "admin-password" | b64dec }}
{{- else }}
{{- $adminPassword = randAlphaNum 24 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "sentry.labels" . | nindent 4 }}
  annotations:
    # Keep this Secret if the release is uninstalled so secrets survive reinstalls.
    "helm.sh/resource-policy": keep
type: Opaque
data:
  secret-key: {{ $secretKey | b64enc | quote }}
  system-secret-key: {{ $systemSecretKey | b64enc | quote }}
  launchpad-rpc-shared-secret: {{ $launchpadSecret | b64enc | quote }}
  clickhouse-password: {{ $clickhousePassword | b64enc | quote }}
  external-postgres-password: {{ .Values.externalPostgresql.password | default "" | b64enc | quote }}
  external-redis-password: {{ .Values.externalRedis.password | default "" | b64enc | quote }}
  {{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
  postgres-password: {{ $postgresPassword | b64enc | quote }}
  {{- end }}
  {{- if and .Values.redis.enabled .Values.redis.auth.enabled (not .Values.redis.auth.existingSecret) }}
  redis-password: {{ $redisPassword | b64enc | quote }}
  {{- end }}
  {{- if not .Values.user.existingSecret }}
  admin-password: {{ $adminPassword | b64enc | quote }}
  {{- end }}
