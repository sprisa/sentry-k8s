{{- $fullname := include "sentry.fullname" . }}
{{- $c := .Values.nginx }}
{{- if $c.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-nginx
  labels:
    {{- include "sentry.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;
    events {
      worker_connections 1024;
    }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      access_log /dev/stdout;
      sendfile on;
      tcp_nopush on;
      tcp_nodelay on;
      reset_timedout_connection on;
      keepalive_timeout 75s;
      gzip off;
      server_tokens off;
      server_names_hash_bucket_size 64;
      types_hash_max_size 2048;
      types_hash_bucket_size 64;
      client_body_buffer_size 64k;
      client_max_body_size {{ $c.clientMaxBodySize | default "100m" }};
      proxy_http_version 1.1;
      proxy_redirect off;
      proxy_buffer_size          128k;
      proxy_buffers              4 256k;
      proxy_busy_buffers_size    256k;
      real_ip_header X-Forwarded-For;
      real_ip_recursive on;
      # Honor an upstream X-Forwarded-Proto when present (e.g. behind Contour /
      # Envoy / an ALB that terminates TLS), otherwise fall back to $scheme.
      # Without this, a TLS-terminating proxy in front would have its "https"
      # clobbered to "http" and Sentry would treat the request as insecure.
      map $http_x_forwarded_proto $sentry_forwarded_proto {
        default $scheme;
        "~.+"   $http_x_forwarded_proto;
      }
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $sentry_forwarded_proto;
      proxy_set_header X-Request-Id $request_id;
      proxy_read_timeout {{ $c.proxyReadTimeout | default "30s" }};
      proxy_send_timeout 5s;
      proxy_cache_path /var/cache/nginx/js-sdk levels=1:2 keys_zone=js_sdk_cache:10m max_size=1g inactive=365d;
      upstream relay {
        server {{ $fullname }}-relay:3000;
        keepalive 2;
      }
      upstream sentry {
        server {{ $fullname }}-web:9000;
        keepalive 2;
      }
      server {
        listen 80;
        location /api/store/ {
          proxy_pass http://relay;
        }
        location ~ ^/api/[1-9]\d*/ {
          proxy_pass http://relay;
        }
        location ^~ /api/0/relays/ {
          proxy_pass http://relay;
        }
      location / {
        proxy_pass http://sentry;
      }
      location /_assets/ {
        proxy_pass http://sentry/_static/dist/sentry/;
        proxy_hide_header Content-Disposition;
      }
      location /_static/ {
        proxy_pass http://sentry;
        proxy_hide_header Content-Disposition;
      }{{- if .Values.sentry.jsSdk.setupAssets }}
      location ^~ /js-sdk/ {
        proxy_pass https://browser.sentry-cdn.com/;
        proxy_set_header Host browser.sentry-cdn.com;
        proxy_cache js_sdk_cache;
        proxy_cache_valid 200 365d;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Set-Cookie;
        add_header Access-Control-Allow-Origin *;
      }{{- end }}
    }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-nginx
  labels:
    {{- include "sentry.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  replicas: {{ $c.replicas | default 1 }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "sentry.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nginx
  template:
    metadata:
      labels:
        {{- include "sentry.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: nginx
      annotations:
        checksum/config: {{ printf "%s|%v|%v|%v" $fullname ($c.clientMaxBodySize | default "100m") ($c.proxyReadTimeout | default "30s") (.Values.sentry.jsSdk.setupAssets) | sha256sum }}
        {{- with $c.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "sentry.serviceAccountName" . }}
      {{- include "sentry.imagePullSecrets" . | nindent 6 }}
      {{- include "sentry.scheduling" (dict "root" . "component" $c) | nindent 6 }}
      containers:
        - name: nginx
          image: "{{ $c.image.repository }}:{{ $c.image.tag }}"
          imagePullPolicy: {{ $c.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          {{- with $c.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $fullname }}-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-nginx
  labels:
    {{- include "sentry.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
  {{- with $c.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $c.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ $c.service.port | default 80 }}
      targetPort: http
  selector:
    {{- include "sentry.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
{{- end }}
