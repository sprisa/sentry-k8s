{{- $fullname := include "sentry.fullname" . }}
{{- $c := .Values.nginx }}
{{- if $c.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-nginx
  labels:
    {{- include "sentry.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;
    events {
      worker_connections 1024;
    }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      access_log /dev/stdout;
      sendfile on;
      tcp_nopush on;
      tcp_nodelay on;
      reset_timedout_connection on;
      keepalive_timeout 75s;
      gzip off;
      server_tokens off;
      server_names_hash_bucket_size 64;
      types_hash_max_size 2048;
      types_hash_bucket_size 64;
      client_body_buffer_size 64k;
      client_max_body_size {{ $c.clientMaxBodySize | default "100m" }};
      proxy_http_version 1.1;
      proxy_redirect off;
      proxy_buffer_size          128k;
      proxy_buffers              4 256k;
      proxy_busy_buffers_size    256k;
      real_ip_header X-Forwarded-For;
      real_ip_recursive on;
      # Honor an upstream X-Forwarded-Proto when present (e.g. behind Contour /
      # Envoy / an ALB that terminates TLS), otherwise fall back to $scheme.
      # Without this, a TLS-terminating proxy in front would have its "https"
      # clobbered to "http" and Sentry would treat the request as insecure.
      map $http_x_forwarded_proto $sentry_forwarded_proto {
        default $scheme;
        "~.+"   $http_x_forwarded_proto;
      }
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $sentry_forwarded_proto;
      proxy_set_header X-Request-Id $request_id;
      proxy_read_timeout {{ $c.proxyReadTimeout | default "30s" }};
      proxy_send_timeout 5s;
      upstream relay {
        server {{ $fullname }}-relay:3000;
        keepalive 2;
      }
      upstream sentry {
        server {{ $fullname }}-web:9000;
        keepalive 2;
      }
      server {
        listen 80;
        location /api/store/ {
          proxy_pass http://relay;
        }
        location ~ ^/api/[1-9]\d*/ {
          proxy_pass http://relay;
        }
        location ^~ /api/0/relays/ {
          proxy_pass http://relay;
        }
      location / {
        proxy_pass http://sentry;
      }
      location /_assets/ {
        proxy_pass http://sentry/_static/dist/sentry/;
        proxy_hide_header Content-Disposition;
      }
      location /_static/ {
        proxy_pass http://sentry;
        proxy_hide_header Content-Disposition;
      }{{- if .Values.sentry.jsSdk.setupAssets }}
      location ^~ /js-sdk/ {
        root /var/www/;
        add_header Access-Control-Allow-Origin *;
      }{{- end }}
    }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-nginx
  labels:
    {{- include "sentry.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  replicas: {{ $c.replicas | default 1 }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "sentry.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nginx
  template:
    metadata:
      labels:
        {{- include "sentry.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: nginx
      annotations:
        checksum/config: {{ printf "%s|%v|%v|%v|%s" $fullname ($c.clientMaxBodySize | default "100m") ($c.proxyReadTimeout | default "30s") (.Values.sentry.jsSdk.setupAssets) (include "sentry.image" (dict "root" . "key" "sentry")) | sha256sum }}
        {{- with $c.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "sentry.serviceAccountName" . }}
      {{- include "sentry.imagePullSecrets" . | nindent 6 }}
      {{- include "sentry.scheduling" (dict "root" . "component" $c) | nindent 6 }}
      {{- if .Values.sentry.jsSdk.setupAssets }}
      {{- $sdkChecksum := include "sentry.image" (dict "root" . "key" "sentry") | sha256sum }}
      initContainers:
        - name: setup-js-sdk-assets
          image: "{{ include "sentry.image" (dict "root" . "key" "sentry") }}"
          imagePullPolicy: {{ include "sentry.imagePullPolicy" (dict "root" . "key" "sentry") }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              MARKER=/var/www/js-sdk/.js-sdk-installed-{{ $sdkChecksum }}
              if [ -f "$MARKER" ]; then
                echo "JS SDK bundles already downloaded (checksum {{ $sdkChecksum }})"
                exit 0
              fi
              REG_PATH=/usr/src/sentry/src/sentry/loader/_registry.json
              if [ ! -f "$REG_PATH" ]; then
                echo "no loader registry found at $REG_PATH — skipping"
                exit 0
              fi
              DEST=/var/www/js-sdk
              mkdir -p "$DEST"
              # Parse the registry to get the latest of each major version (v4–v10).
              VERSIONS=$(python3 -c "
              import json, sys, os
              reg = json.load(open('$REG_PATH'))
              majors = {'4','5','6','7','8','9','10'}
              seen = set()
              for v in reversed(reg['versions']):
                  m = v.split('.')[0]
                  if m in majors and m not in seen:
                      seen.add(m)
                      print(v)
              " 2>/dev/null || echo "")
              if [ -z "$VERSIONS" ]; then
                echo "no SDK versions found — skipping"
                exit 0
              fi
              echo "downloading SDK bundles: $(echo $VERSIONS)"
              for ver in $VERSIONS; do
                for variant in bundle bundle.tracing bundle.tracing.replay bundle.replay bundle.tracing.replay.feedback bundle.feedback; do
                  url="https://browser.sentry-cdn.com/$ver/$variant.min.js"
                  fdir="$DEST/$ver"
                  mkdir -p "$fdir"
                  if curl -sL -f --compressed --connect-timeout 10 --max-time 30 -o "$fdir/$variant.min.js" "$url" 2>/dev/null; then
                    echo "  OK  $ver/$variant.min.js"
                  else
                    echo "  SKIP $ver/$variant.min.js"
                  fi
                done
              done
              find "$DEST" -type d -exec chmod 755 {} \;
              find "$DEST" -type f -exec chmod 644 {} \;
              touch "$MARKER"
              echo "done"
          volumeMounts:
            - name: js-sdk
              mountPath: /var/www/js-sdk
      {{- end }}
      containers:
        - name: nginx
          image: "{{ $c.image.repository }}:{{ $c.image.tag }}"
          imagePullPolicy: {{ $c.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf{{- if .Values.sentry.jsSdk.setupAssets }}
            - name: js-sdk
              mountPath: /var/www/js-sdk
{{- end }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          {{- with $c.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $fullname }}-nginx
        {{- if .Values.sentry.jsSdk.setupAssets }}
        - name: js-sdk
        {{- if .Values.sentry.jsSdk.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $fullname }}-js-sdk
        {{- else }}
          emptyDir: {}
        {{- end }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-nginx
  labels:
    {{- include "sentry.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
  {{- with $c.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $c.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ $c.service.port | default 80 }}
      targetPort: http
  selector:
    {{- include "sentry.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
{{- end }}
