{{- $fullname := include "sentry.fullname" . }}
{{- $c := .Values.snuba.api }}
{{- if (ne $c.enabled false) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-snuba
  labels:
    {{- include "sentry.labels" . | nindent 4 }}
    app.kubernetes.io/component: snuba-api
spec:
  replicas: {{ $c.replicas | default 1 }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "sentry.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: snuba-api
  template:
    metadata:
      labels:
        {{- include "sentry.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: snuba-api
      {{- with $c.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "sentry.serviceAccountName" . }}
      {{- include "sentry.imagePullSecrets" . | nindent 6 }}
      {{- include "sentry.scheduling" (dict "root" . "component" $c) | nindent 6 }}
      initContainers:
        {{- include "sentry.waitForInfra" (dict "root" . "deps" (list "clickhouse" "redis")) | nindent 8 }}
      containers:
        - name: snuba-api
          image: "{{ include "sentry.image" (dict "root" . "key" "snuba") }}"
          imagePullPolicy: {{ include "sentry.imagePullPolicy" (dict "root" . "key" "snuba") }}
          args: ["api"]
          env:
            {{- include "sentry.snubaEnv" . | nindent 12 }}
            {{- with $c.env }}{{ toYaml . | nindent 12 }}{{- end }}
          ports:
            - name: http
              containerPort: 1218
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          {{- with $c.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-snuba
  labels:
    {{- include "sentry.labels" . | nindent 4 }}
    app.kubernetes.io/component: snuba-api
  {{- with $c.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 1218
      targetPort: http
  selector:
    {{- include "sentry.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: snuba-api
{{- if $c.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $fullname }}-snuba
  labels:
    {{- include "sentry.labels" . | nindent 4 }}
    app.kubernetes.io/component: snuba-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $fullname }}-snuba
  minReplicas: {{ $c.autoscaling.minReplicas }}
  maxReplicas: {{ $c.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $c.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
