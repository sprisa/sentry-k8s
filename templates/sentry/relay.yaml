{{- $fullname := include "sentry.fullname" . }}
{{- $c := .Values.relay }}
{{- if (ne $c.enabled false) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-relay-config
  labels:
    {{- include "sentry.labels" . | nindent 4 }}
    app.kubernetes.io/component: relay
data:
  config.yml: |
    relay:
      upstream: "http://{{ $fullname }}-web:9000/"
      host: 0.0.0.0
      port: 3000
    logging:
      level: WARN
    processing:
      enabled: true
      kafka_config:
        - {name: "bootstrap.servers", value: "{{ include "sentry.kafka.bootstrap" . }}"}
        - {name: "message.max.bytes", value: {{ .Values.kafka.maxMessageBytes | default 50000000 | int64 }}}
      redis: redis://{{ include "sentry.redis.host" . }}:{{ include "sentry.redis.port" . }}
    health:
      max_memory_percent: 1.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-relay
  labels:
    {{- include "sentry.labels" . | nindent 4 }}
    app.kubernetes.io/component: relay
spec:
  replicas: {{ $c.replicas | default 1 }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "sentry.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: relay
  template:
    metadata:
      labels:
        {{- include "sentry.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: relay
      annotations:
        checksum/config: {{ printf "%s|%s|%v" (include "sentry.kafka.bootstrap" .) (include "sentry.redis.host" .) .Values.kafka.maxMessageBytes | sha256sum }}
        {{- with $c.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "sentry.serviceAccountName" . }}
      {{- include "sentry.imagePullSecrets" . | nindent 6 }}
      {{- include "sentry.scheduling" (dict "root" . "component" $c) | nindent 6 }}
      initContainers:
        {{- include "sentry.waitForInfra" (dict "root" . "deps" (list "kafka" "redis")) | nindent 8 }}
        # The relay image is distroless (no shell), so we can't cp/conditionally
        # run. config.yml is mounted directly via subPath; credentials are
        # (re)generated into the emptyDir each start (--overwrite => idempotent).
        - name: relay-credentials
          image: "{{ include "sentry.image" (dict "root" . "key" "relay" "override" $c.image) }}"
          imagePullPolicy: {{ include "sentry.imagePullPolicy" (dict "root" . "key" "relay" "override" $c.image) }}
          args: ["credentials", "generate", "--overwrite"]
          volumeMounts:
            - name: relay-data
              mountPath: /work/.relay
            - name: relay-config
              mountPath: /work/.relay/config.yml
              subPath: config.yml
      containers:
        - name: relay
          image: "{{ include "sentry.image" (dict "root" . "key" "relay" "override" $c.image) }}"
          imagePullPolicy: {{ include "sentry.imagePullPolicy" (dict "root" . "key" "relay" "override" $c.image) }}
          args: ["run"]
          env:
            - name: RELAY_STATSD_ADDR
              value: ""
            {{- with $c.env }}{{ toYaml . | nindent 12 }}{{- end }}
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: relay-data
              mountPath: /work/.relay
            - name: relay-config
              mountPath: /work/.relay/config.yml
              subPath: config.yml
          livenessProbe:
            httpGet:
              path: /api/relay/healthcheck/live/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /api/relay/healthcheck/ready/
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          {{- with $c.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: relay-data
          emptyDir: {}
        - name: relay-config
          configMap:
            name: {{ $fullname }}-relay-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-relay
  labels:
    {{- include "sentry.labels" . | nindent 4 }}
    app.kubernetes.io/component: relay
  {{- with $c.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
  selector:
    {{- include "sentry.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: relay
{{- end }}
