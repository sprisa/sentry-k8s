{{- $fullname := include "sentry.fullname" . }}
{{- $c := .Values.vroom }}
{{- $enabled := include "sentry.enabled" (dict "root" . "component" $c "tier" "feature-complete") }}
{{- if eq $enabled "true" }}
{{- $sc := $c.persistence.storageClass | default .Values.global.storageClass }}
{{- $profilesS3 := eq .Values.filestore.profiles.backend "s3" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-vroom
  labels:
    {{- include "sentry.labels" . | nindent 4 }}
    app.kubernetes.io/component: vroom
spec:
  replicas: {{ $c.replicas | default 1 }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "sentry.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: vroom
  template:
    metadata:
      labels:
        {{- include "sentry.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: vroom
    spec:
      serviceAccountName: {{ include "sentry.serviceAccountName" . }}
      {{- include "sentry.imagePullSecrets" . | nindent 6 }}
      {{- include "sentry.scheduling" (dict "root" . "component" $c) | nindent 6 }}
      initContainers:
        {{- include "sentry.waitForInfra" (dict "root" . "deps" (list "kafka")) | nindent 8 }}
      containers:
        - name: vroom
          image: "{{ include "sentry.image" (dict "root" . "key" "vroom") }}"
          imagePullPolicy: {{ include "sentry.imagePullPolicy" (dict "root" . "key" "vroom") }}
          env:
            - name: SENTRY_KAFKA_BROKERS_PROFILING
              value: {{ include "sentry.kafka.bootstrap" . | quote }}
            - name: SENTRY_KAFKA_BROKERS_OCCURRENCES
              value: {{ include "sentry.kafka.bootstrap" . | quote }}
            - name: SENTRY_SNUBA_HOST
              value: {{ include "sentry.snuba.host" . }}
            {{- if $profilesS3 }}
            - name: SENTRY_BUCKET_PROFILES
              value: "s3://{{ .Values.filestore.profiles.s3.bucketName }}?endpoint={{ .Values.filestore.profiles.s3.endpointUrl }}&s3ForcePathStyle=true&region={{ .Values.filestore.profiles.s3.region_name | default "auto" }}"
            {{- if .Values.filestore.profiles.s3.existingSecret }}
            - name: AWS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.filestore.profiles.s3.existingSecret }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.filestore.profiles.s3.existingSecret }}
                  key: AWS_SECRET_ACCESS_KEY
            {{- else }}
            - name: AWS_ACCESS_KEY
              value: {{ .Values.filestore.profiles.s3.accessKey | quote }}
            - name: AWS_SECRET_KEY
              value: {{ .Values.filestore.profiles.s3.secretKey | quote }}
            {{- end }}
            {{- else }}
            - name: SENTRY_BUCKET_PROFILES
              value: "file://localhost//var/vroom/sentry-profiles"
            {{- end }}
            {{- with $c.env }}{{ toYaml . | nindent 12 }}{{- end }}
          ports:
            - name: http
              containerPort: 8085
          volumeMounts:
            - name: data
              mountPath: /var/vroom/sentry-profiles
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          {{- with $c.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          {{- if $c.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $fullname }}-vroom
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-vroom
  labels:
    {{- include "sentry.labels" . | nindent 4 }}
    app.kubernetes.io/component: vroom
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8085
      targetPort: http
  selector:
    {{- include "sentry.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: vroom
{{- if $c.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-vroom
  labels:
    {{- include "sentry.labels" . | nindent 4 }}
    app.kubernetes.io/component: vroom
spec:
  accessModes:
    - {{ $c.persistence.accessMode | default "ReadWriteOnce" }}
  {{- if $sc }}
  storageClassName: {{ $sc | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $c.persistence.size }}
{{- end }}
{{- end }}
