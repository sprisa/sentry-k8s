{{/* Sentry task system + Kafka ingest/forwarder/subscription consumers. */}}
{{- $tb := printf "%s-taskbroker:50051" (include "sentry.fullname" .) }}
{{- $legacySubscriptionConsumers := semverCompare "<26.7.0" .Chart.AppVersion }}

{{- /* ---------- task system (errors-only) ---------- */}}
---
{{ include "sentry.workload" (dict "root" . "name" "taskscheduler" "component" .Values.sentry.taskscheduler "imageKey" "sentry" "healthcheckFile" false "command" (list "run" "taskworker-scheduler")) }}
---
{{ include "sentry.workload" (dict "root" . "name" "taskworker" "component" .Values.sentry.taskworker "imageKey" "sentry" "healthcheckFile" true "command" (list "run" "taskworker" (printf "--concurrency=%v" (.Values.sentry.taskworker.concurrency | default 4)) (printf "--rpc-host=%s" $tb) "--health-check-file-path=/tmp/health.txt" "--max-child-task-count=10000")) }}

{{- /* ---------- ingest consumers (errors-only) ---------- */}}
---
{{ include "sentry.workload" (dict "root" . "name" "events-consumer" "component" .Values.sentry.ingestEvents "imageKey" "sentry" "healthcheckFile" true "maxPollIntervalMs" true "command" (list "run" "consumer" "ingest-events" "--consumer-group" "ingest-consumer" "--healthcheck-file-path" "/tmp/health.txt")) }}
---
{{ include "sentry.workload" (dict "root" . "name" "attachments-consumer" "component" .Values.sentry.ingestAttachments "imageKey" "sentry" "healthcheckFile" true "maxPollIntervalMs" true "command" (list "run" "consumer" "ingest-attachments" "--consumer-group" "ingest-consumer" "--healthcheck-file-path" "/tmp/health.txt")) }}
---
{{ include "sentry.workload" (dict "root" . "name" "post-process-forwarder-errors" "component" .Values.sentry.postProcessForwarderErrors "imageKey" "sentry" "healthcheckFile" true "maxPollIntervalMs" true "command" (list "run" "consumer" "--no-strict-offset-reset" "post-process-forwarder-errors" "--consumer-group" "post-process-forwarder" "--synchronize-commit-log-topic=snuba-commit-log" "--synchronize-commit-group=snuba-consumers" "--healthcheck-file-path" "/tmp/health.txt")) }}
{{- if $legacySubscriptionConsumers }}
---
{{ include "sentry.workload" (dict "root" . "name" "subscription-consumer-events" "component" .Values.sentry.subscriptionConsumerEvents "imageKey" "sentry" "healthcheckFile" true "maxPollIntervalMs" true "command" (list "run" "consumer" "events-subscription-results" "--consumer-group" "query-subscription-consumer" "--healthcheck-file-path" "/tmp/health.txt")) }}
{{- end }}

{{- /* ---------- ingest consumers (feature-complete) ---------- */}}
---
{{ include "sentry.workload" (dict "root" . "name" "transactions-consumer" "component" .Values.sentry.transactions "imageKey" "sentry" "healthcheckFile" true "maxPollIntervalMs" true "command" (list "run" "consumer" "ingest-transactions" "--consumer-group" "ingest-consumer" "--healthcheck-file-path" "/tmp/health.txt")) }}
---
{{ include "sentry.workload" (dict "root" . "name" "metrics-consumer" "component" .Values.sentry.metrics "imageKey" "sentry" "healthcheckFile" true "maxPollIntervalMs" true "command" (list "run" "consumer" "ingest-metrics" "--consumer-group" "metrics-consumer" "--healthcheck-file-path" "/tmp/health.txt")) }}
---
{{ include "sentry.workload" (dict "root" . "name" "generic-metrics-consumer" "component" .Values.sentry.genericMetrics "imageKey" "sentry" "healthcheckFile" true "maxPollIntervalMs" true "command" (list "run" "consumer" "ingest-generic-metrics" "--consumer-group" "generic-metrics-consumer" "--healthcheck-file-path" "/tmp/health.txt")) }}
---
{{ include "sentry.workload" (dict "root" . "name" "billing-metrics-consumer" "component" .Values.sentry.billingMetrics "imageKey" "sentry" "healthcheckFile" true "maxPollIntervalMs" true "command" (list "run" "consumer" "billing-metrics-consumer" "--consumer-group" "billing-metrics-consumer" "--healthcheck-file-path" "/tmp/health.txt")) }}
---
{{ include "sentry.workload" (dict "root" . "name" "ingest-replay-recordings" "component" .Values.sentry.ingestReplayRecordings "imageKey" "sentry" "healthcheckFile" true "maxPollIntervalMs" true "command" (list "run" "consumer" "ingest-replay-recordings" "--consumer-group" "ingest-replay-recordings" "--healthcheck-file-path" "/tmp/health.txt")) }}
---
{{ include "sentry.workload" (dict "root" . "name" "ingest-occurrences" "component" .Values.sentry.ingestOccurrences "imageKey" "sentry" "healthcheckFile" true "maxPollIntervalMs" true "command" (list "run" "consumer" "ingest-occurrences" "--consumer-group" "ingest-occurrences" "--healthcheck-file-path" "/tmp/health.txt")) }}
---
{{ include "sentry.workload" (dict "root" . "name" "ingest-profiles" "component" .Values.sentry.ingestProfiles "imageKey" "sentry" "healthcheckFile" true "maxPollIntervalMs" true "command" (list "run" "consumer" "ingest-profiles" "--consumer-group" "ingest-profiles" "--healthcheck-file-path" "/tmp/health.txt")) }}
---
{{ include "sentry.workload" (dict "root" . "name" "ingest-monitors" "component" .Values.sentry.ingestMonitors "imageKey" "sentry" "healthcheckFile" true "maxPollIntervalMs" true "command" (list "run" "consumer" "ingest-monitors" "--consumer-group" "ingest-monitors" "--healthcheck-file-path" "/tmp/health.txt")) }}
---
{{ include "sentry.workload" (dict "root" . "name" "ingest-feedback-events" "component" .Values.sentry.ingestFeedback "imageKey" "sentry" "healthcheckFile" true "maxPollIntervalMs" true "command" (list "run" "consumer" "ingest-feedback-events" "--consumer-group" "ingest-feedback" "--healthcheck-file-path" "/tmp/health.txt")) }}
---
{{ include "sentry.workload" (dict "root" . "name" "process-spans" "component" .Values.sentry.processSpans "imageKey" "sentry" "healthcheckFile" true "maxPollIntervalMs" true "command" (list "run" "consumer" "--no-strict-offset-reset" "process-spans" "--consumer-group" "process-spans" "--healthcheck-file-path" "/tmp/health.txt")) }}
---
{{ include "sentry.workload" (dict "root" . "name" "process-segments" "component" .Values.sentry.processSegments "imageKey" "sentry" "healthcheckFile" true "maxPollIntervalMs" true "command" (list "run" "consumer" "--no-strict-offset-reset" "process-segments" "--consumer-group" "process-segments" "--healthcheck-file-path" "/tmp/health.txt")) }}
---
{{ include "sentry.workload" (dict "root" . "name" "monitors-clock-tick" "component" .Values.sentry.monitorsClockTick "imageKey" "sentry" "healthcheckFile" true "maxPollIntervalMs" true "command" (list "run" "consumer" "monitors-clock-tick" "--consumer-group" "monitors-clock-tick" "--healthcheck-file-path" "/tmp/health.txt")) }}
---
{{ include "sentry.workload" (dict "root" . "name" "monitors-clock-tasks" "component" .Values.sentry.monitorsClockTasks "imageKey" "sentry" "healthcheckFile" true "maxPollIntervalMs" true "command" (list "run" "consumer" "monitors-clock-tasks" "--consumer-group" "monitors-clock-tasks" "--healthcheck-file-path" "/tmp/health.txt")) }}
---
{{ include "sentry.workload" (dict "root" . "name" "uptime-results" "component" .Values.sentry.uptimeResults "imageKey" "sentry" "healthcheckFile" true "maxPollIntervalMs" true "command" (list "run" "consumer" "uptime-results" "--consumer-group" "uptime-results" "--healthcheck-file-path" "/tmp/health.txt")) }}
---
{{ include "sentry.workload" (dict "root" . "name" "post-process-forwarder-transactions" "component" .Values.sentry.postProcessForwarderTransactions "imageKey" "sentry" "healthcheckFile" true "maxPollIntervalMs" true "command" (list "run" "consumer" "--no-strict-offset-reset" "post-process-forwarder-transactions" "--consumer-group" "post-process-forwarder" "--synchronize-commit-log-topic=snuba-transactions-commit-log" "--synchronize-commit-group" "transactions_group" "--healthcheck-file-path" "/tmp/health.txt")) }}
---
{{ include "sentry.workload" (dict "root" . "name" "post-process-forwarder-issue-platform" "component" .Values.sentry.postProcessForwarderIssuePlatform "imageKey" "sentry" "healthcheckFile" true "maxPollIntervalMs" true "command" (list "run" "consumer" "--no-strict-offset-reset" "post-process-forwarder-issue-platform" "--consumer-group" "post-process-forwarder" "--synchronize-commit-log-topic=snuba-generic-events-commit-log" "--synchronize-commit-group" "generic_events_group" "--healthcheck-file-path" "/tmp/health.txt")) }}
{{- if $legacySubscriptionConsumers }}
---
{{ include "sentry.workload" (dict "root" . "name" "subscription-consumer-transactions" "component" .Values.sentry.subscriptionConsumerTransactions "imageKey" "sentry" "healthcheckFile" true "maxPollIntervalMs" true "command" (list "run" "consumer" "transactions-subscription-results" "--consumer-group" "query-subscription-consumer" "--healthcheck-file-path" "/tmp/health.txt")) }}
{{- end }}
{{- if $legacySubscriptionConsumers }}
---
{{ include "sentry.workload" (dict "root" . "name" "subscription-consumer-metrics" "component" .Values.sentry.subscriptionConsumerMetrics "imageKey" "sentry" "healthcheckFile" true "maxPollIntervalMs" true "command" (list "run" "consumer" "metrics-subscription-results" "--consumer-group" "query-subscription-consumer" "--healthcheck-file-path" "/tmp/health.txt")) }}
{{- end }}
{{- if $legacySubscriptionConsumers }}
---
{{ include "sentry.workload" (dict "root" . "name" "subscription-consumer-generic-metrics" "component" .Values.sentry.subscriptionConsumerGenericMetrics "imageKey" "sentry" "healthcheckFile" true "maxPollIntervalMs" true "command" (list "run" "consumer" "generic-metrics-subscription-results" "--consumer-group" "query-subscription-consumer" "--healthcheck-file-path" "/tmp/health.txt")) }}
{{- end }}
{{- if $legacySubscriptionConsumers }}
---
{{ include "sentry.workload" (dict "root" . "name" "subscription-consumer-eap-items" "component" .Values.sentry.subscriptionConsumerEapItems "imageKey" "sentry" "healthcheckFile" true "maxPollIntervalMs" true "command" (list "run" "consumer" "subscription-results-eap-items" "--consumer-group" "subscription-results-eap-items" "--healthcheck-file-path" "/tmp/health.txt")) }}
{{- end }}
