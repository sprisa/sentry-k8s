{{- if .Values.clickhouse.enabled }}
{{- $fullname := include "sentry.fullname" . }}
{{- $clustered := eq (include "sentry.clickhouse.singleNode" .) "false" }}
{{- $headless := printf "%s-clickhouse-headless" $fullname }}
{{- $shards := int .Values.clickhouse.layout.shardsCount }}
{{- $replicas := int .Values.clickhouse.layout.replicasCount }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-clickhouse-config
  labels:
    {{- include "sentry.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
data:
  sentry.xml: |
    <clickhouse>
        <logger>
            <level>warning</level>
            <console>true</console>
        </logger>
        {{- range $k, $v := .Values.clickhouse.settings }}
        <{{ $k }}>{{ $v }}</{{ $k }}>
        {{- end }}
        <query_thread_log remove="remove"/>
        <query_log remove="remove"/>
        <query_views_log remove="remove"/>
        <text_log remove="remove"/>
        <trace_log remove="remove"/>
        <metric_log remove="remove"/>
        <asynchronous_metric_log remove="remove"/>
        <session_log remove="remove"/>
        <part_log remove="remove"/>
        <processors_profile_log remove="remove"/>
        <error_log remove="remove"/>
        <latency_log remove="remove"/>
        <allow_nullable_key>1</allow_nullable_key>
        <merge_tree>
            <enable_mixed_granularity_parts>1</enable_mixed_granularity_parts>
            <max_suspicious_broken_parts>100</max_suspicious_broken_parts>
        </merge_tree>
        {{- if $clustered }}
        <remote_servers>
            <{{ .Values.clickhouse.clusterName }}>
                {{- range $s := until $shards }}
                <shard>
                    <internal_replication>true</internal_replication>
                    {{- range $r := until $replicas }}
                    <replica>
                        <host>{{ $fullname }}-clickhouse-{{ add (mul $s $replicas) $r }}.{{ $headless }}</host>
                        <port>9000</port>
                    </replica>
                    {{- end }}
                </shard>
                {{- end }}
            </{{ .Values.clickhouse.clusterName }}>
        </remote_servers>
        <zookeeper>
            {{- range $i := until (int .Values.clickhouse.keeper.replicaCount) }}
            <node>
                <host>{{ $fullname }}-clickhouse-keeper-{{ $i }}.{{ $fullname }}-clickhouse-keeper-headless</host>
                <port>9181</port>
            </node>
            {{- end }}
        </zookeeper>
        {{- end }}
    </clickhouse>
  sentry-users.xml: |
    <clickhouse>
        <users>
            <default>
                {{- if .Values.clickhouse.password }}
                <password>{{ .Values.clickhouse.password }}</password>
                {{- else }}
                <password></password>
                {{- end }}
                <networks>
                    <ip>::/0</ip>
                </networks>
                <profile>default</profile>
                <quota>default</quota>
                <access_management>1</access_management>
            </default>
        </users>
        <profiles>
            <default>
                <log_queries>0</log_queries>
                <log_query_threads>0</log_query_threads>
                {{- range $k, $v := .Values.clickhouse.profiles }}
                {{- $parts := splitList "/" $k }}
                {{- if eq (len $parts) 2 }}
                {{- /* key form: profile/setting -- only emit when profile is "default" */}}
                {{- if eq (index $parts 0) "default" }}
                <{{ index $parts 1 }}>{{ $v }}</{{ index $parts 1 }}>
                {{- end }}
                {{- else }}
                <{{ $k }}>{{ $v }}</{{ $k }}>
                {{- end }}
                {{- end }}
            </default>
        </profiles>
    </clickhouse>
{{- end }}
