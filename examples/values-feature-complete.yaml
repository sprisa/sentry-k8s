# Full parity with docker-compose feature-complete: transactions, replays,
# metrics, generic-metrics, profiling, EAP, monitors, uptime, spans/segments,
# launchpad, vroom. Uses object storage (R2/S3) and shows the optional HA
# ClickHouse layout. Resource-heavy (~40 pods) - size datastores accordingly.

global:
  storageClass: longhorn

sentry:
  # Surface every product (performance, replays, profiling, etc.).
  selfHostedErrorsOnly: false
  system:
    url: https://sentry.example.com

  # Full pipeline (Sentry side). errors-only consumers stay on via the defaults.
  transactions: { enabled: true }
  metrics: { enabled: true }
  genericMetrics: { enabled: true }
  billingMetrics: { enabled: true }
  ingestReplayRecordings: { enabled: true }
  ingestOccurrences: { enabled: true }
  ingestProfiles: { enabled: true }
  ingestMonitors: { enabled: true }
  ingestFeedback: { enabled: true }
  processSpans: { enabled: true }
  processSegments: { enabled: true }
  monitorsClockTick: { enabled: true }
  monitorsClockTasks: { enabled: true }
  uptimeResults: { enabled: true }
  postProcessForwarderTransactions: { enabled: true }
  postProcessForwarderIssuePlatform: { enabled: true }
  subscriptionConsumerTransactions: { enabled: true }
  subscriptionConsumerMetrics: { enabled: true }
  subscriptionConsumerGenericMetrics: { enabled: true }
  subscriptionConsumerEapItems: { enabled: true }

# Full pipeline (Snuba side).
snuba:
  transactionsConsumer: { enabled: true }
  replaysConsumer: { enabled: true }
  issueOccurrenceConsumer: { enabled: true }
  metricsConsumer: { enabled: true }
  genericMetricsSetsConsumer: { enabled: true }
  genericMetricsCountersConsumer: { enabled: true }
  genericMetricsDistributionsConsumer: { enabled: true }
  genericMetricsGaugesConsumer: { enabled: true }
  profilingProfilesConsumer: { enabled: true }
  profilingFunctionsConsumer: { enabled: true }
  profilingChunksConsumer: { enabled: true }
  eapItemsConsumer: { enabled: true }
  subscriptionConsumerTransactions: { enabled: true }
  subscriptionConsumerMetrics: { enabled: true }
  subscriptionConsumerGenericMetricsSets: { enabled: true }
  subscriptionConsumerGenericMetricsCounters: { enabled: true }
  subscriptionConsumerGenericMetricsDistributions: { enabled: true }
  subscriptionConsumerGenericMetricsGauges: { enabled: true }
  subscriptionConsumerEapItems: { enabled: true }

user:
  create: true
  email: admin@example.com
  existingSecret: sentry-admin           # password read from this Secret (key: admin-password)

# Profiling (vroom), uptime checks, and launchpad workers.
vroom:
  enabled: true
uptimeChecker:
  enabled: true
launchpad:
  enabled: true

# Native stacktrace symbolication (opt-in).
symbolicator:
  enabled: true

clickhouse:
  enabled: true
  persistence:
    enabled: true
    size: 500Gi
  # Pin the datastore to a beefy node
  nodeSelector:
    kubernetes.io/hostname: datastore-node-1
  settings:
    max_server_memory_usage_to_ram_ratio: "0.75"
  profiles:
    default/max_memory_usage: "8589934592"            # 8 GiB
    default/max_bytes_before_external_group_by: "6442450944"
    default/max_bytes_before_external_sort: "6442450944"

  # --- Optional HA (uncomment for multi-node). Auto-enables ClickHouse Keeper,
  # templates remote_servers + macros, and switches Snuba to clustered mode. ---
  # layout:
  #   shardsCount: 2
  #   replicasCount: 2
  # clusterName: sentry
  # keeper:
  #   enabled: true
  #   replicaCount: 3

# Object storage for filestore, nodestore, replays, and profiles.
# Recommended for feature-complete (replays/profiling are storage-heavy).
# The R2 credentials live in a Secret with keys AWS_ACCESS_KEY_ID /
# AWS_SECRET_ACCESS_KEY.
filestore:
  backend: s3
  s3:
    existingSecret: sentry-r2
    bucketName: sentry
    endpointUrl: https://<account>.r2.cloudflarestorage.com
    region_name: auto
  profiles:
    backend: s3
    s3:
      existingSecret: sentry-r2
      bucketName: sentry-profiles
      endpointUrl: https://<account>.r2.cloudflarestorage.com
      region_name: auto

replay:
  storage:
    backend: s3
    s3:
      existingSecret: sentry-r2
      bucketName: sentry-replays
      endpointUrl: https://<account>.r2.cloudflarestorage.com
      region_name: auto

nodestore:
  backend: s3                            # installs sentry-nodestore-s3 via init container
  s3:
    existingSecret: sentry-r2
    bucketName: sentry-nodestore
    endpointUrl: https://<account>.r2.cloudflarestorage.com
    region_name: auto

# Datastores: this preset demonstrates the bundled HA toggles. Drop these blocks
# to run everything single-node, or point external* at managed services instead.
kafka:
  enabled: true
  # Multi-broker KRaft. replicas must be odd (controller quorum); RF/minISR make
  # auto-created topics durable across broker loss.
  replicas: 3
  replicationFactor: 3
  minInsyncReplicas: 2
  persistence:
    size: 50Gi

postgresql:
  enabled: true
  # Single-node by design. For real Postgres HA, set enabled:false and point
  # externalPostgresql at a managed/operator cluster (RDS, CloudNativePG, ...).
  maxConnections: 200
  persistence:
    size: 50Gi

redis:
  enabled: true
  # Sentinel HA: master + replicas + sentinels, fronted by an HAProxy master
  # router so the -redis-master endpoint always follows failover.
  architecture: replication
  replicas: 3
  sentinel:
    enabled: true
